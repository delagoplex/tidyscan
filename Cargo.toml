[package]
name = "tidyscan"
version = "0.1.0"
edition = "2024"
description = "Ordner analysieren und sicher aufräumen: Struktur, alte Dateien, Duplikate, Quarantäne mit Undo"
license = "MIT"
readme = "README.md"
keywords = ["disk-usage", "duplicates", "cleanup", "egui"]
categories = ["filesystem", "command-line-utilities"]

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[dependencies]
anyhow = "1.0.104"
blake3 = "1.8.7"
clap = { version = "4.6.7", features = ["derive"] }
crossbeam-channel = "0.5.17"
dirs = "7.0.0"
dunce = "1.0.5"
eframe = "0.36.2"
egui_extras = "0.36.2"
globset = "0.4.20"
humansize = "2.1.3"
jwalk = "0.9.0"
rayon = "1.12.0"
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
time = { version = "0.3.55", features = ["formatting", "macros", "local-offset"] }
toml = "1.1.8"

[dev-dependencies]
filetime = "0.2.29"
tempfile = "3.27.0"

# Keine Debug-Infos für fremde Crates: halbiert target/debug, Backtraces im eigenen Code bleiben.
[profile.dev.package."*"]
debug = false
